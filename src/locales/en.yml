en:
  console:
    descriptor:
      usage: "Usage:"
      command_usage: "command [options] [arguments]"
      available_commands: "Available commands:"
      available_namespace_commands: "Available commands for the '%{namespace}' namespace:"
      description: "Description:"
      help: "Help:"
      arguments: "Arguments:"
      options: "Options:"
      default: "[default: %{value}]"
      multiple_values_allowed: "(multiple values allowed)"
    global:
      command: "The command to execute"
      help: "Display help for the given command. When no command is given display help for the %{command} command"
      quiet: "Do not output any message"
      verbose: "Increase the verbosity of messages: 1 for normal output, 2 for more verbose output and 3 for debug"
      version: "Display this application version"
      ansi: "Force (or disable --no-ansi) ANSI output"
      no_interaction: "Do not ask any interactive question"
    commands:
      help:
        description: "Display help for a command"
        argument: "The command name"
        format: "The output format (txt)"
        raw: "To output raw command help"
        help: |
          The <info>%command.name%</info> command displays help for a given command:

            <info>%command.full_name% list</info>

          To display the list of available commands, please use the <info>list</info> command.
      list:
        description: "List available commands"
        argument: "Only list commands in this namespace"
        raw: "To output raw command list"
        format: "The output format (txt)"
        short: "To skip describing command's arguments"
        help: |
          The <info>%command.name%</info> command lists all commands:

            <info>%command.full_name%</info>

          You can also display the commands for a specific namespace:

            <info>%command.full_name% test</info>

          It's also possible to get raw list of commands (useful for embedding command runner):

            <info>%command.full_name% --raw</info>
      completion:
        description: "Dump the shell completion script"
        argument: "The shell type (e.g. 'bash'), the value of the '$SHELL' env var will be used if not provided"
        help: |
          The <info>%command.name%</> command dumps the shell completion script required
          to use shell autocompletion (currently, %{shells} completion are supported).

          <comment>Static installation
          -------------------</>

          Dump the script to a global completion file and restart your shell:

              <info>%command.full_name% %{shell} | sudo tee %{completion_file}</>

          Or dump the script to a local file and source it:

              <info>%command.full_name% %{shell} > completion.sh</>

              <comment># source the file whenever you use the project</>
              <info>source completion.sh</>

              <comment># or add this line at the end of your "%{rc_file}" file:</>
              <info>source /path/to/completion.sh</>

          <comment>Dynamic installation
          --------------------</>

          Add this to the end of your shell configuration file (e.g. <info>"%{rc_file}"</>):

              <info>eval "$(%{full_command} completion %{shell})"</>
  commands:
    common:
      arguments:
        addon: "Addon name or ID."
        app: "The ID or NAME of the app."
        namespace: "The namespace ID or name."
        pipeline: "pipeline name or ID"
        team: "The team ID or name"
      options:
        app: "The app."
        app_id_or_name: "App name or ID."
        app_name: "The name of the application."
        environment: "The environment ID (for pipeline environments)."
        json: "Output in JSON format."
        namespace: "The namespace."
        region: "The region (default: %{region})."
        shell: "Output in shell format."
        team: "Team name or ID."
        zone: "The zone ID."
    addons:
      list:
        description: "List addons for an app or team."
        help: "List all addons provisioned for an app or team."
      services:
        description: "List available addon services."
        help: "List all available addon services from the catalog."
      plans:
        description: "List plans for an addon service."
        arguments:
          service: "Addon service name (e.g. bld-postgres)."
        help: "List available plans for an addon service."
      create:
        description: "Create an addon for an app."
        arguments:
          plan: "Addon service and plan (e.g. bld-postgres:essential-0)."
        options:
          name: "Custom name for the addon."
          human_name: "Display name for the addon."
          description: "Description for the addon."
          config: "Config key=value (repeatable)."
        help: "Provision a new addon for an app."
      info:
        description: "Show info about an addon."
        help: "Show detailed information about an addon, including attachments."
      destroy:
        description: "Destroy an addon."
        help: "Destroy an addon (deprovisions and removes from all attached apps)."
      attach:
        description: "Attach an addon to an app."
        options:
          app: "App name or ID to attach to."
          as: "Attachment name (e.g. DATABASE_RED)."
        help: "Attach an existing addon to an app."
      detach:
        description: "Detach an addon from an app."
        arguments:
          attachment: "Addon attachment ID."
        help: "Detach an addon from an app."
    apps:
      list:
        description: "List the apps you have access to."
        help: |
          List apps you have access to. By default, only personal apps are shown.
          To see apps owned by a team, use the -t flag. Use `bld teams` to see
          your available teams and their apps.

          Examples:
            $ bld apps                  # personal apps only
            $ bld apps -t my-team       # apps for a specific team
            $ bld teams                 # list teams to find team apps
      info:
        description: "Show the details of a specific application."
      create:
        description: "Create a new application."
        arguments:
          name: "The name of the app to create."
        options:
          team: "The team to create the app in."
        help: "Create a new application."
      stacks:
        description: "Show the stack for an app."
        help: |
          Show the current stack for an application. The stack determines the
          base operating system image used for builds and dynos.

          Example:
            $ bld apps:stacks -a my-app
            Stack: heroku-24
      stacks_set:
        description: "Set the stack for an app."
        arguments:
          stack: "The stack to set (e.g. heroku-22, heroku-24)."
        help: |
          Set the build stack for an application. This determines the base
          operating system image used for the next build. The change takes
          effect on the next deployment.

          Common stacks: heroku-20, heroku-22, heroku-24

          Example:
            $ bld apps:stacks:set heroku-24 -a my-app
            Stack set to heroku-24 for my-app.
    buildpacks:
      common:
        arguments:
          buildpack: "The buildpack URL or name."
        options:
          index_insert: "1-based position to insert at."
          index_replace: "1-based position to replace."
          index_remove: "1-based index of buildpack to remove."
      list:
        description: "List the buildpacks for an app."
        help: |
          Display the buildpacks configured for an application, in order.

          Example:
            $ bld buildpacks -a my-app
      add:
        description: "Add a buildpack to an app."
        help: |
          Append a buildpack to the list, or insert at a specific position with -i.

          Examples:
            $ bld buildpacks:add heroku/nodejs -a my-app
            $ bld buildpacks:add heroku/ruby -a my-app -i 1
      set:
        description: "Set a buildpack on an app."
        help: |
          Replace the first buildpack (or the one at a given index) with a new one.

          Examples:
            $ bld buildpacks:set heroku/nodejs -a my-app
            $ bld buildpacks:set heroku/ruby -a my-app -i 2
      remove:
        description: "Remove a buildpack from an app."
        help: |
          Remove a buildpack by name/URL or by index. Specify one, not both.

          Examples:
            $ bld buildpacks:remove heroku/nodejs -a my-app
            $ bld buildpacks:remove -i 2 -a my-app
      clear:
        description: "Clear all buildpacks for an app."
        help: |
          Remove all buildpacks from an application.

          Example:
            $ bld buildpacks:clear -a my-app
    config:
      list:
        description: "Get the config variables for an app or environment."
        help: "Display the config variables for an app or environment."
      get:
        description: "Get the config variables for an app or environment."
        arguments:
          key: "The name of the config variable(s) to get."
        help: "Display the config variables for an app or environment."
      set:
        description: "Set config variables for an app or environment. Reads from STDIN when piped."
        arguments:
          key_value: "The name and value of the config variable(s) to set. Omit to read from STDIN."
        options:
          chunk_size: "Max vars per API call when setting many at once (default: 20)."
        help: |
          Set config variables for an app or environment.

          Values can be provided as KEY=VALUE arguments, or piped on STDIN using
          the shell format emitted by `bld config -s` (KEY=value or KEY='value').
          Blank lines, `#` comments, and an optional `export` prefix are ignored.

          Large batches are sent in chunks (default 20 vars per call) to avoid
          upstream request timeouts. Tune with --chunk-size.

          Examples:
            bld config:set KEY1=val1 KEY2=val2 -a my-app
            bld config -a src-app -s | bld config:set -a dst-app
            bld config -a src-app -s > env.out && bld config:set -a dst-app < env.out
            bld config:set -a my-app --chunk-size 10 < big.env
      unset:
        description: "Unset config variables for an app or environment."
        arguments:
          key: "The name of the config variable(s) to unset."
        help: "Unset a config variable for an app or environment."
    domains:
      common:
        arguments:
          hostname: "The domain name."
          hostname_add: "The domain name to add."
          hostname_remove: "The domain name to remove."
        options:
          cert: "The name of the SSL cert to use for this domain."
      list:
        description: "List all domains for an app."
        help: "List all domains (default domain + custom domains) for an app."
      add:
        description: "Add a domain to an app."
        options:
          wait: "Wait for domain to be active."
        help: "Add a custom domain to an app."
      remove:
        description: "Remove a domain from an app."
        help: "Remove a custom domain from an app."
      clear:
        description: "Clear all custom domains from an app."
        help: "Remove all custom domains from an app. Platform domains cannot be removed."
      info:
        description: "Show detailed information about a domain."
        help: "Display detailed information about a specific domain."
      update:
        description: "Update a domain's SSL certificate."
        help: "Update a domain's SSL certificate configuration."
      wait:
        description: "Wait for a domain to become active."
        help: "Wait for a domain to finish provisioning and become active."
    login:
      description: "Login to your Build account"
      help: "This command is used to login to the Build API. The Build API token is stored in the user's netrc file. Because the commandline needs the token, it does a three-way OAuth authentication. This command requests a login authorization from Build, then opens a browser to have the users OAuth-accept that authorization. Once the user accepts the authorization, the command polls the Build API to get the user's token."
    logs:
      description: "Display the logs for an application."
      help: "Display the logs for an application."
      options:
        process: "The Procfile process to display logs for."
        tail: "Tail the logs."
        count: "Number of lines to display."
        source: "The log source to display from (app or build)."
        zone: "The zone to retrieve logs from."
    namespaces:
      list:
        description: "List the namespaces you are a member of"
        help: "Namespaces include namespaces that you are a member of, and namespaces that you own."
      info:
        description: "Get information about a namespace"
        help: "Get information about a namespace."
      create:
        description: "Create a new namespace"
        arguments:
          name: "The name of the namespace"
        options:
          team: "The team ID or name (default: personal)."
        help: "Create a new namespace."
      delete:
        description: "Delete a namespace"
        help: "Delete a namespace."
    oidc_login:
      description: "Login to your Build cluster"
      options:
        region: "The region of the cluster to access"
      help: "Login to your Build cluster"
    pipelines:
      list:
        description: "list your pipelines"
        help: "Lists pipelines accessible to the current user.\n\nUse -t to filter by team."
      info:
        description: "show detailed information for a pipeline"
        help: "Displays information about a specific pipeline"
      diff:
        description: "compares the latest release of this app to its downstream app(s)"
        options:
          app: "Source app to compare"
        help: "Shows commit differences between a source app and its downstream pipeline targets.\n\nExamples:\n  bld pipelines:diff -a my-app-staging"
      promote:
        description: "promote the latest release of this app to its downstream app(s)"
        options:
          app: "Source app to promote"
          to: "Comma-separated target app names (default: all downstream)"
          no_wait: "Return immediately after creating the promotion"
        help: "Promotes the latest release from a source app to its downstream pipeline targets.\n\nExamples:\n  bld pipelines:promote -a my-app-staging\n  bld pipelines:promote -a my-app-staging --to my-app-prod,my-app-prod-eu\n  bld pipelines:promote -a my-app-staging --no-wait"
    ps:
      list:
        description: "List running processes for an application"
        help: "List running processes for an application"
      restart:
        description: "Restart processes on the application"
        arguments:
          process: "The NAME of the process type to restart"
        help: "Restart processes on the application"
      scale:
        description: "Scale process formation"
        arguments:
          args: "TYPE=QUANTITY[:SIZE] pairs (e.g. web=2:Standard-2X worker=1)"
        help: "Scale process types. With no arguments, shows current formation.\n\nExamples:\n  ps:scale -a myapp web=2\n  ps:scale -a myapp web=2:Standard-2X worker=1"
      exec:
        description: "Execute a command in a running dyno"
        options:
          dyno: "The NAME of the dyno (e.g. web.1) to exec into"
          status: "Show exec readiness for all dynos"
        arguments:
          cmd: "Command to run inside the dyno"
        help: "Execute a command in a running dyno.\n\nWith no CMD, opens an interactive bash session.\nWith CMD, executes the command and returns output.\nWith --status, shows exec readiness per dyno."
    run:
      description: "Run a command in a once-off dyno on the Build platform"
      arguments:
        cmd: "The command to run"
      options:
        app: "The app to run the command on"
        debug: "Show verbose debugging information"
        no_tty: "Force the command to not run in a tty"
        exit_code: "Passthrough the exit code of the remote command"
        file: "Send a local file as stdin to the remote command"
        shell: "Pass the command to the remote shell for interpretation (enables $VAR, globs, pipes, multi-command)"
      help: |
        Run a one-off command on the Build platform. Useful for migrations,
        console sessions, or ad-hoc scripts.

        By default each argument is POSIX single-quoted before being sent to
        the remote side, so parentheses, braces, quotes, $VAR, globs, and
        other shell metacharacters reach the target process literally:

          bld run ruby -e 'puts ENV["HOME"]' -a my-app
          bld run rake 'test:unit[foo,bar]' -a my-app

        Use -c/--shell when you actually want the remote shell to interpret
        metacharacters (variable expansion, pipes, multiple commands):

          bld run -c 'echo $RAILS_ENV | tee /tmp/env' -a my-app

        Use --file (or stdin redirection) to send a local file as stdin and
        sidestep quoting entirely:

          bld run rails runner -a my-app --file script.rb
          bld run rails runner -a my-app < script.rb
    skills:
      description: "Show how to use bld (useful for AI agents and LLMs)."
      help: "Prints a comprehensive guide to Build.io CLI commands with examples."
    teams:
      list:
        description: "List the teams you are a member of"
        help: "Teams include teams that you are a member of, and teams that you own."
      info:
        description: "Get information about a team"
        help: "Get information about a team."
    whoami:
      description: "Display the current logged in user"
      help: "Build commands run through the CLI use the API with permission level of this user. To see the current user, run this command. To change users, see the login command."
