name: Build Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup MinGW UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            crystal:p
            shards:p
            libssh2:p
            pkgconf:p
            ntldd:p
      - name: Build MinGW Windows binary
        run: |
          shards install --production
          mkdir -p bin/windows-amd64
          crystal build src/build_cli.cr --release --no-debug -o bin/windows-amd64/bld.exe
        shell: msys2 {0}

      - name: Copy MinGW runtime DLLs
        run: |
          build_dir=bin/windows-amd64
          dll_count=0
          while IFS= read -r dll; do
            dll_path=$(cygpath -u "$dll")
            case "$dll_path" in
              "$MINGW_PREFIX"/bin/*.dll)
                cp "$dll_path" "$build_dir/"
                dll_count=$((dll_count + 1))
                ;;
            esac
          done < <(
            ntldd -R "$build_dir/bld.exe" |
              sed -n 's/.*=> \(.*\.dll\).*/\1/p' |
              sort -u
          )

          if [ "$dll_count" -eq 0 ]; then
            echo "ntldd found no MinGW runtime DLLs for $build_dir/bld.exe" >&2
            ntldd -R "$build_dir/bld.exe" >&2
            exit 1
          fi

          BUILD_NO_UPDATE_CHECK=1 PATH="$PWD/$build_dir:/c/Windows/System32:/c/Windows" "$build_dir/bld.exe" --help > /dev/null
        shell: msys2 {0}

      - name: Get version
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref }}" -replace 'refs/tags/v', ''
            echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Create release zips
        run: |
          Compress-Archive -Path bin/windows-amd64/* -DestinationPath bin/windows-amd64/bld-windows-amd64.zip
        shell: powershell

      - name: Smoke test release zips
        run: |
          $ErrorActionPreference = "Stop"
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:BUILD_NO_UPDATE_CHECK = "1"

          function Invoke-BldSmoke {
            param([string]$SmokeDir, [string[]]$Arguments)

            $stdout = Join-Path $env:RUNNER_TEMP "$([Guid]::NewGuid()).out"
            $stderr = Join-Path $env:RUNNER_TEMP "$([Guid]::NewGuid()).err"

            try {
              $process = Start-Process -FilePath "$SmokeDir\bld.exe" -ArgumentList $Arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $stdoutText = if (Test-Path $stdout) { Get-Content -Path $stdout -Raw -ErrorAction SilentlyContinue } else { "" }
              $stderrText = if (Test-Path $stderr) { Get-Content -Path $stderr -Raw -ErrorAction SilentlyContinue } else { "" }

              [PSCustomObject]@{
                ExitCode = $process.ExitCode
                Output = "$stdoutText$stderrText"
              }
            } finally {
              Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
            }
          }

          try {
            $zips = @(
              "bin/windows-amd64/bld-windows-amd64.zip"
            )

            foreach ($zip in $zips) {
              $smokeDir = Join-Path $env:RUNNER_TEMP "bld-smoke-$([IO.Path]::GetFileNameWithoutExtension($zip))"
              Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
              Expand-Archive -Path $zip -DestinationPath $smokeDir

              $help = Invoke-BldSmoke $smokeDir @("--help")
              if ($help.ExitCode -ne 0) {
                throw "$zip bld.exe --help exited with $($help.ExitCode)`n$($help.Output)"
              }
              if ($help.Output -notmatch "Usage:") {
                throw "$zip bld.exe --help produced no usage output`n$($help.Output)"
              }
            }
          } finally {
            $env:PATH = $oldPath
            Remove-Item Env:\BUILD_NO_UPDATE_CHECK -ErrorAction SilentlyContinue
          }
        shell: powershell

      - name: Upload Windows binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            bin/windows-amd64/bld-windows-amd64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Scoop manifest
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/windows-amd64/bld-windows-amd64.zip).Hash.ToLowerInvariant()
          $manifestPath = "bucket/bld.json"
          $downloadUrl = "https://github.com/buildio/cli/releases/download/v$env:VERSION/bld-windows-amd64.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          git pull --ff-only origin main

          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest.architecture."64bit".url = $downloadUrl
          $manifest.architecture."64bit".hash = $hash

          $json = $manifest | ConvertTo-Json -Depth 10
          Set-Content -Path $manifestPath -Value $json -Encoding utf8
          git add $manifestPath

          $changedFiles = git diff --cached --name-only
          if (-not $changedFiles) {
            Write-Host "Scoop manifest already current."
          } else {
            git commit -m "Update Scoop manifest to v$env:VERSION"
            git push origin main
          }
        shell: pwsh

      - name: Update Chocolatey manifest
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zipPath = "bin/windows-amd64/bld-windows-amd64.zip"
          $nuspecPath = "chocolatey/bld.nuspec"
          $installScriptPath = "chocolatey/tools/chocolateyInstall.ps1"

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/buildio/cli/releases/download/v$env:VERSION/bld-windows-amd64.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pick up the Scoop manifest commit from the previous step.
          git fetch origin main
          git checkout -B main origin/main

          # Update the Chocolatey package version.
          [xml]$nuspec = Get-Content -Path $nuspecPath -Raw
          $nuspec.package.metadata.version = $env:VERSION
          $resolvedNuspecPath = (Resolve-Path $nuspecPath).Path
          $nuspec.Save($resolvedNuspecPath)

          # Update chocolateyInstall.ps1.
          $installScript = Get-Content -Path $installScriptPath -Raw

          # Prefer the explicit 64-bit Chocolatey fields. Fall back to url/checksum
          # if the package currently uses those instead.
          $url64Pattern = "(?im)^(\s*url64(?:bit)?\s*=\s*)'[^']*'"
          $urlPattern = "(?im)^(\s*url\s*=\s*)'[^']*'"

          if ([regex]::IsMatch($installScript, $url64Pattern)) {
            $installScript = $installScript -replace `
              $url64Pattern, `
              ('$1' + "'$downloadUrl'")
          } elseif ([regex]::IsMatch($installScript, $urlPattern)) {
            $installScript = $installScript -replace `
              $urlPattern, `
              ('$1' + "'$downloadUrl'")
          } else {
            throw "Could not find url64/url64bit/url in $installScriptPath"
          }

          $checksum64Pattern = "(?im)^(\s*checksum64\s*=\s*)'[^']*'"
          $checksumPattern = "(?im)^(\s*checksum\s*=\s*)'[^']*'"

          if ([regex]::IsMatch($installScript, $checksum64Pattern)) {
            $installScript = $installScript -replace `
              $checksum64Pattern, `
              ('$1' + "'$hash'")
          } elseif ([regex]::IsMatch($installScript, $checksumPattern)) {
            $installScript = $installScript -replace `
              $checksumPattern, `
              ('$1' + "'$hash'")
          } else {
            throw "Could not find checksum64/checksum in $installScriptPath"
          }

          $checksumType64Pattern = "(?im)^(\s*checksumType64\s*=\s*)'[^']*'"
          $checksumTypePattern = "(?im)^(\s*checksumType\s*=\s*)'[^']*'"

          if ([regex]::IsMatch($installScript, $checksumType64Pattern)) {
            $installScript = $installScript -replace `
              $checksumType64Pattern, `
              ('$1' + "'sha256'")
          } elseif ([regex]::IsMatch($installScript, $checksumTypePattern)) {
            $installScript = $installScript -replace `
              $checksumTypePattern, `
              ('$1' + "'sha256'")
          } else {
            throw "Could not find checksumType64/checksumType in $installScriptPath"
          }

          Set-Content `
            -Path $installScriptPath `
            -Value $installScript `
            -Encoding utf8 `
            -NoNewline

          git add $nuspecPath $installScriptPath

          $changedFiles = git diff --cached --name-only

          if (-not $changedFiles) {
            Write-Host "Chocolatey manifest already current."
          } else {
            git commit -m "Update Chocolatey manifest to v$env:VERSION"
            git push origin main
          }
