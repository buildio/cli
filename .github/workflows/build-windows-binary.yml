name: Build Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            crystal:p
            shards:p
            libssh2:p
            ntldd:p


      - name: Install Crystal
        run: |
          iwr -useb get.scoop.sh -outfile 'install-scoop.ps1'
          .\install-scoop.ps1 -RunAsAdmin
          scoop install crystal
          echo "$HOME\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          crystal --version
          shards --version
        shell: powershell

      - name: Install dependencies
        run: |
          shards install --production
        shell: powershell

      - name: Build Windows binary
        run: |
          New-Item -ItemType Directory -Force -Path bin/windows-amd64
          crystal build src/build_cli.cr --release --no-debug -o bin/windows-amd64/bld.exe
        shell: powershell

      - name: Copy runtime DLLs
        run: |
          $ErrorActionPreference = "Stop"
          $crystalRoot = (& scoop prefix crystal).Trim()
          $runtimeDlls = @(
            "gc.dll",
            "iconv-2.dll",
            "libcrypto-3-x64.dll",
            "libssl-3-x64.dll",
            "mpir.dll",
            "pcre2-8.dll",
            "yaml.dll",
            "zlib1.dll"
          )

          foreach ($dll in $runtimeDlls) {
            $source = Get-ChildItem -Path $crystalRoot -Recurse -Filter $dll -File | Select-Object -First 1
            if (-not $source) {
              throw "Could not find Crystal runtime DLL '$dll' under '$crystalRoot'."
            }

            Copy-Item -Path $source.FullName -Destination "bin/windows-amd64/$dll" -Force
          }
        shell: powershell
      - name: Build MinGW Windows binary
        run: |
          shards install --production
          mkdir -p bin/windows-amd64-mingw
          crystal build src/build_cli.cr --release --no-debug -o bin/windows-amd64-mingw/bld.exe
        shell: msys2 {0}

      - name: Copy MinGW runtime DLLs
        run: |
          build_dir=bin/windows-amd64-mingw
          ntldd -R "$build_dir/bld.exe" |
            sed -n 's/.*=> \(\/ucrt64\/bin\/[^ ]*\.dll\).*/\1/p' |
            sort -u |
            while IFS= read -r dll; do
              cp "$dll" "$build_dir/"
            done
        shell: msys2 {0}

      - name: Get version
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref }}" -replace 'refs/tags/v', ''
            echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Create release zips
        run: |
          Compress-Archive -Path bin/windows-amd64/* -DestinationPath bin/windows-amd64/bld-windows-amd64.zip
          Compress-Archive -Path bin/windows-amd64-mingw/* -DestinationPath bin/windows-amd64-mingw/bld-windows-amd64-mingw.zip
        shell: powershell

      - name: Smoke test release zips
        run: |
          $ErrorActionPreference = "Stop"
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:BUILD_NO_UPDATE_CHECK = "1"

          function Invoke-BldSmoke {
            param([string]$SmokeDir, [string[]]$Arguments)

            $stdout = Join-Path $env:RUNNER_TEMP "$([Guid]::NewGuid()).out"
            $stderr = Join-Path $env:RUNNER_TEMP "$([Guid]::NewGuid()).err"

            try {
              $process = Start-Process -FilePath "$SmokeDir\bld.exe" -ArgumentList $Arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $stdoutText = if (Test-Path $stdout) { Get-Content -Path $stdout -Raw -ErrorAction SilentlyContinue } else { "" }
              $stderrText = if (Test-Path $stderr) { Get-Content -Path $stderr -Raw -ErrorAction SilentlyContinue } else { "" }

              [PSCustomObject]@{
                ExitCode = $process.ExitCode
                Output = "$stdoutText$stderrText"
              }
            } finally {
              Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
            }
          }

          try {
            $zips = @(
              "bin/windows-amd64/bld-windows-amd64.zip",
              "bin/windows-amd64-mingw/bld-windows-amd64-mingw.zip"
            )

            foreach ($zip in $zips) {
              $smokeDir = Join-Path $env:RUNNER_TEMP "bld-smoke-$([IO.Path]::GetFileNameWithoutExtension($zip))"
              Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
              Expand-Archive -Path $zip -DestinationPath $smokeDir

              $help = Invoke-BldSmoke $smokeDir @("--help")
              if ($help.ExitCode -ne 0) {
                throw "$zip bld.exe --help exited with $($help.ExitCode)`n$($help.Output)"
              }
              if ($help.Output -notmatch "Usage:") {
                throw "$zip bld.exe --help produced no usage output`n$($help.Output)"
              }
            }
          } finally {
            $env:PATH = $oldPath
            Remove-Item Env:\BUILD_NO_UPDATE_CHECK -ErrorAction SilentlyContinue
          }
        shell: powershell

      - name: Upload Windows binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            bin/windows-amd64/bld-windows-amd64.zip
            bin/windows-amd64-mingw/bld-windows-amd64-mingw.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Scoop manifest
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/windows-amd64-mingw/bld-windows-amd64-mingw.zip).Hash.ToLowerInvariant()
          $manifestPath = "bucket/bld.json"
          $downloadUrl = "https://github.com/buildio/cli/releases/download/v$env:VERSION/bld-windows-amd64-mingw.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          git pull --ff-only origin main

          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest.architecture."64bit".url = $downloadUrl
          $manifest.architecture."64bit".hash = $hash

          $json = $manifest | ConvertTo-Json -Depth 10
          Set-Content -Path $manifestPath -Value $json -Encoding utf8
          git add $manifestPath

          $changedFiles = git diff --cached --name-only
          if (-not $changedFiles) {
            Write-Host "Scoop manifest already current."
          } else {
            git commit -m "Update Scoop manifest to v$env:VERSION"
            git push origin main
          }
        shell: pwsh
