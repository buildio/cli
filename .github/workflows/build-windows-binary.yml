name: Build Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Crystal
        run: |
          iwr -useb get.scoop.sh -outfile 'install-scoop.ps1'
          .\install-scoop.ps1 -RunAsAdmin
          scoop install crystal
          echo "$HOME\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          crystal --version
          shards --version
        shell: powershell

      - name: Install dependencies
        run: |
          shards install --production
        shell: powershell

      - name: Build Windows binary
        run: |
          New-Item -ItemType Directory -Force -Path bin/windows-amd64
          crystal build src/build_cli.cr --release --no-debug -o bin/windows-amd64/bld.exe
        shell: powershell

      - name: Get version
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref }}" -replace 'refs/tags/v', ''
            echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Create release zip
        run: |
          Compress-Archive -Path bin/windows-amd64/bld.exe -DestinationPath bin/windows-amd64/bld-windows-amd64.zip
        shell: powershell

      - name: Upload Windows binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            bin/windows-amd64/bld-windows-amd64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Scoop manifest
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/windows-amd64/bld-windows-amd64.zip).Hash.ToLowerInvariant()
          $manifestPath = "bucket/bld.json"
          $downloadUrl = "https://github.com/buildio/cli/releases/download/v$env:VERSION/bld-windows-amd64.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          git pull --ff-only origin main

          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest.architecture."64bit".url = $downloadUrl
          $manifest.architecture."64bit".hash = $hash

          $json = $manifest | ConvertTo-Json -Depth 10
          Set-Content -Path $manifestPath -Value $json -Encoding utf8
          git add $manifestPath

          $changedFiles = git diff --cached --name-only
          if (-not $changedFiles) {
            Write-Host "Scoop manifest already current."
          } else {
            git commit -m "Update Scoop manifest to v$env:VERSION"
            git push origin main
          }
        shell: pwsh
