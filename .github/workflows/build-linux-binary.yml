name: Build Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly dpkg-dev gnupg

      - name: Build Linux binary
        run: |
          make build

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release zip
        run: |
          cd bin/linux-amd64
          zip -j bld-linux-amd64.zip bld

      - name: Build Debian package
        id: deb
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          DEB_VERSION="${VERSION}-1"
          PACKAGE_ROOT="pkg/bld_${DEB_VERSION}_amd64"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/bld"

          install -m 0755 bin/linux-amd64/bld "$PACKAGE_ROOT/usr/bin/bld"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/bld/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "bld_${DEB_VERSION}_amd64.deb"

          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_path=bld_${DEB_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Prepare APT signing key
        id: signing
        env:
          APT_GPG_PRIVATE_KEY_BASE64: ${{ secrets.APT_GPG_PRIVATE_KEY_BASE64 }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ vars.APT_GPG_PUBLIC_KEYS_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          if [ -n "$APT_GPG_PRIVATE_KEY_BASE64" ]; then
            echo "$APT_GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APT_GPG_PRIVATE_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Run locally to open GitHub's prefilled fine-grained PAT form, select only the buildio/cli repository, paste the generated token, and store it as the persistent bootstrap secret for key bootstrap/rotation: open 'https://github.com/settings/personal-access-tokens/new?name=Build.io+APT+bootstrap&description=Persistent+token+used+by+the+Build+CLI+release+workflow+to+store+and+rotate+APT+signing+secrets&target_name=buildio&expires_in=none&secrets=write' && read -rsp 'Paste fine-grained PAT: ' APT_SECRET_BOOTSTRAP_TOKEN && echo && gh secret set APT_SECRET_BOOTSTRAP_TOKEN --repo $GITHUB_REPOSITORY --body \"\$APT_SECRET_BOOTSTRAP_TOKEN\""
              exit 1
            fi

            cat > "$RUNNER_TEMP/apt-gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Build.io APT Repository
          Name-Email: support@build.io
          Expire-Date: 0
          %commit
          EOF

            gpg --batch --generate-key "$RUNNER_TEMP/apt-gpg-batch"
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys "Build.io APT Repository <support@build.io>" | awk -F: '$1 == "fpr" {print $10; exit}')"

            PRIVATE_KEY_BASE64="$(gpg --batch --yes --armor --export-secret-keys "$KEY_ID" | base64 | tr -d '\n')"
            PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            echo "::add-mask::$PRIVATE_KEY_BASE64"

            printf '%s' "$PRIVATE_KEY_BASE64" | gh secret set APT_GPG_PRIVATE_KEY_BASE64 --repo "$GITHUB_REPOSITORY"
            echo "Generated and saved a new APT signing key for future releases."
          fi

          if [ -z "$KEY_ID" ]; then
            echo "::error::Unable to determine the APT signing key fingerprint."
            exit 1
          fi

          gpg --batch --list-secret-keys "$KEY_ID" >/dev/null

          if [ -z "${PUBLIC_KEYS_BASE64:-}" ]; then
            if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
              PUBLIC_KEYS_BASE64="$APT_GPG_PUBLIC_KEYS_BASE64"
            else
              PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            fi
          fi

          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          {
            echo "public_keys_base64<<EOF"
            printf '%s\n' "$PUBLIC_KEYS_BASE64"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build archive keyring package
        id: keyring
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ steps.signing.outputs.public_keys_base64 }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"

          if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
            echo "$APT_GPG_PUBLIC_KEYS_BASE64" | base64 -d > apt-public-keys.asc
          else
            gpg --batch --yes --armor --export "$APT_GPG_KEY_ID" > apt-public-keys.asc
          fi

          gpg --batch --yes --dearmor -o buildio-archive-keyring.gpg apt-public-keys.asc

          PACKAGE_ROOT="pkg/buildio-archive-keyring_${DEB_VERSION}_all"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/share/keyrings"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring"

          install -m 0644 buildio-archive-keyring.gpg "$PACKAGE_ROOT/usr/share/keyrings/buildio-archive-keyring.gpg"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/keyring-control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "buildio-archive-keyring_${DEB_VERSION}_all.deb"

          echo "keyring_deb_path=buildio-archive-keyring_${DEB_VERSION}_all.deb" >> "$GITHUB_OUTPUT"
          echo "public_keys_path=apt-public-keys.asc" >> "$GITHUB_OUTPUT"

      - name: Verify Debian packages
        env:
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
        run: |
          set -euo pipefail
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          dpkg-deb --info "$KEYRING_DEB_PATH"
          dpkg-deb --contents "$KEYRING_DEB_PATH"

      - name: Publish APT repository
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
          PUBLIC_KEYS_PATH: ${{ steps.keyring.outputs.public_keys_path }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf public-pages existing-debs
          mkdir -p existing-debs

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add public-pages origin/gh-pages
          else
            git worktree add --detach public-pages
            git -C public-pages checkout --orphan gh-pages
            git -C public-pages rm -rf . || true
          fi

          shopt -s nullglob globstar
          old_debs=(public-pages/apt/pool/**/*.deb)
          if ((${#old_debs[@]})); then
            cp "${old_debs[@]}" existing-debs/
          fi
          cp "$DEB_PATH" existing-debs/
          cp "$KEYRING_DEB_PATH" existing-debs/

          APTLY_ROOT="$RUNNER_TEMP/aptly"
          rm -rf "$APTLY_ROOT"
          APTLY_CONFIG="$RUNNER_TEMP/aptly.conf"
          cat > "$APTLY_CONFIG" <<EOF
          {
            "rootDir": "$APTLY_ROOT",
            "downloadConcurrency": 4,
            "downloadSpeedLimit": 0,
            "architectures": [],
            "dependencyFollowSuggests": false,
            "dependencyFollowRecommends": false,
            "dependencyFollowAllVariants": false,
            "dependencyFollowSource": false,
            "dependencyVerboseResolve": false,
            "gpgDisableSign": false,
            "gpgDisableVerify": false,
            "gpgProvider": "gpg",
            "downloadSourcePackages": false,
            "skipLegacyPool": true,
            "ppaDistributorID": "ubuntu",
            "ppaCodename": "",
            "FileSystemPublishEndpoints": {},
            "S3PublishEndpoints": {},
            "SwiftPublishEndpoints": {}
          }
          EOF
          PUBLISH_ARGS=(
            -batch
            -distribution=stable
            -component=main
            -architectures=amd64,all
            -gpg-key="$APT_GPG_KEY_ID"
            -origin="Build.io"
            -label="Build.io CLI"
          )

          aptly -config="$APTLY_CONFIG" repo create -distribution=stable -component=main bld
          aptly -config="$APTLY_CONFIG" repo add -force-replace bld existing-debs
          aptly -config="$APTLY_CONFIG" publish repo "${PUBLISH_ARGS[@]}" bld apt

          cp "$PUBLIC_KEYS_PATH" "$APTLY_ROOT/public/apt/gpg.key"

          rm -rf public-pages/apt
          cp -a "$APTLY_ROOT/public/apt" public-pages/apt
          install -m 0755 packaging/apt/install.sh public-pages/install.sh
          touch public-pages/.nojekyll

          git -C public-pages add apt install.sh .nojekyll
          git -C public-pages commit -m "Publish APT package ${DEB_VERSION}" || true
          git -C public-pages push origin HEAD:gh-pages

      - name: Build release body
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-body.md
          from pathlib import Path
          import os
          import sys

          readme = Path("README.md").read_text()
          lines = readme.splitlines()

          start = next((i for i, line in enumerate(lines) if line == "## Install"), None)
          if start is None:
              sys.exit("README.md is missing a ## Install section")

          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          install = "\n".join(lines[start:end]).strip()
          if not install:
              sys.exit("README.md ## Install section is empty")

          print(f"Release of version {os.environ['VERSION']}")
          print()
          print(install)
          PY

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release-body.md
          files: |
            bin/linux-amd64/bld-linux-amd64.zip
            ${{ steps.deb.outputs.deb_path }}
            ${{ steps.keyring.outputs.keyring_deb_path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}