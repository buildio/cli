name: Build Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.6)'
        required: true
        type: string

concurrency:
  group: cli-pages-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly dpkg-dev gnupg

      - name: Build Linux binary
        run: |
          make build

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release zip
        run: |
          cd bin/linux-amd64
          zip -j bld-linux-amd64.zip bld


      - name: Build Debian package
        id: deb
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          DEB_VERSION="${VERSION}-1"
          PACKAGE_ROOT="pkg/bld_${DEB_VERSION}_amd64"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/bld"

          install -m 0755 bin/linux-amd64/bld "$PACKAGE_ROOT/usr/bin/bld"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/bld/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "bld_${DEB_VERSION}_amd64.deb"

          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_path=bld_${DEB_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Build Alpine package
        id: apk
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          PKGVER="${VERSION}-r0"
          BUILDDATE="$(git log -1 --pretty=format:%ct)"
          SIZE="$(stat -c '%s' bin/linux-amd64/bld)"

          mkdir -p "$RUNNER_TEMP/apk-build/pkg/usr/bin"
          install -m 0755 bin/linux-amd64/bld "$RUNNER_TEMP/apk-build/pkg/usr/bin/bld"

          sed \
            -e "s/@PKGVER@/${PKGVER}/" \
            -e "s/@BUILDDATE@/${BUILDDATE}/" \
            -e "s/@SIZE@/${SIZE}/" \
            packaging/apk/PKGINFO.tpl > "$RUNNER_TEMP/apk-build/.PKGINFO"

          docker run --rm \
            -e PKGVER \
            -v "$RUNNER_TEMP/apk-build:/work" \
            -w /work \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache abuild >/dev/null
              . /usr/share/abuild/functions.sh

              # Data section: sorted, per-file checksums (mirrors abuild create_apks)
              (
                cd pkg
                find usr -print0 | LC_ALL=C sort -z \
                  | apk_tar -T - --owner=0 --group=0 --numeric-owner \
                  | abuild-tar --hash | gzip -n -9
              ) > data.tar.gz

              # Control section: .PKGINFO with datahash
              echo "datahash = $(sha256sum data.tar.gz | cut -f1 -d" ")" >> .PKGINFO
              printf "%s\0" .PKGINFO > .metafiles
              apk_tar -T .metafiles | abuild-tar --cut | gzip -n -9 > control.tar.gz

              cat control.tar.gz data.tar.gz > "bld-${PKGVER}.apk"
            '

          echo "apk_path=$RUNNER_TEMP/apk-build/bld-${PKGVER}.apk" >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK signing key
        id: apk_signing
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-keys"

          if [ -n "$APK_SIGNING_KEY_BASE64" ]; then
            echo "$APK_SIGNING_KEY_BASE64" | base64 -d | tar -C "$RUNNER_TEMP/apk-keys" -x
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APK_SIGNING_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Store the fine-grained PAT with secrets:write for the buildio/cli repository as the persistent bootstrap secret (same one the APT key bootstrap uses)."
              exit 1
            fi

            openssl genrsa -out "$RUNNER_TEMP/apk-keys/buildio.rsa" 4096 2>/dev/null
            openssl rsa -in "$RUNNER_TEMP/apk-keys/buildio.rsa" -pubout -out "$RUNNER_TEMP/apk-keys/buildio.rsa.pub" 2>/dev/null

            tar -C "$RUNNER_TEMP/apk-keys" -c buildio.rsa buildio.rsa.pub | base64 | tr -d '\n' > "$RUNNER_TEMP/apk-secret-body"
            echo "::add-mask::$(cat "$RUNNER_TEMP/apk-secret-body")"
            gh secret set APK_SIGNING_KEY_BASE64 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/apk-secret-body"
            rm -f "$RUNNER_TEMP/apk-secret-body"
            echo "Generated and saved a new APK signing key for future releases."
          fi

          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa"
          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa.pub"
          echo "keys_dir=$RUNNER_TEMP/apk-keys" >> "$GITHUB_OUTPUT"

      - name: Prepare APT signing key
        id: signing
        env:
          APT_GPG_PRIVATE_KEY_BASE64: ${{ secrets.APT_GPG_PRIVATE_KEY_BASE64 }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ vars.APT_GPG_PUBLIC_KEYS_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          if [ -n "$APT_GPG_PRIVATE_KEY_BASE64" ]; then
            echo "$APT_GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APT_GPG_PRIVATE_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Run locally to open GitHub's prefilled fine-grained PAT form, select only the buildio/cli repository, paste the generated token, and store it as the persistent bootstrap secret for key bootstrap/rotation: open 'https://github.com/settings/personal-access-tokens/new?name=Build.io+APT+bootstrap&description=Persistent+token+used+by+the+Build+CLI+release+workflow+to+store+and+rotate+APT+signing+secrets&target_name=buildio&expires_in=none&secrets=write' && read -rsp 'Paste fine-grained PAT: ' APT_SECRET_BOOTSTRAP_TOKEN && echo && gh secret set APT_SECRET_BOOTSTRAP_TOKEN --repo $GITHUB_REPOSITORY --body \"\$APT_SECRET_BOOTSTRAP_TOKEN\""
              exit 1
            fi

            cat > "$RUNNER_TEMP/apt-gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Build.io APT Repository
          Name-Email: support@build.io
          Expire-Date: 0
          %commit
          EOF

            gpg --batch --generate-key "$RUNNER_TEMP/apt-gpg-batch"
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys "Build.io APT Repository <support@build.io>" | awk -F: '$1 == "fpr" {print $10; exit}')"

            PRIVATE_KEY_BASE64="$(gpg --batch --yes --armor --export-secret-keys "$KEY_ID" | base64 | tr -d '\n')"
            PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            echo "::add-mask::$PRIVATE_KEY_BASE64"

            printf '%s' "$PRIVATE_KEY_BASE64" | gh secret set APT_GPG_PRIVATE_KEY_BASE64 --repo "$GITHUB_REPOSITORY"
            echo "Generated and saved a new APT signing key for future releases."
          fi

          if [ -z "$KEY_ID" ]; then
            echo "::error::Unable to determine the APT signing key fingerprint."
            exit 1
          fi

          gpg --batch --list-secret-keys "$KEY_ID" >/dev/null

          if [ -z "${PUBLIC_KEYS_BASE64:-}" ]; then
            if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
              PUBLIC_KEYS_BASE64="$APT_GPG_PUBLIC_KEYS_BASE64"
            else
              PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            fi
          fi

          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          {
            echo "public_keys_base64<<EOF"
            printf '%s\n' "$PUBLIC_KEYS_BASE64"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build archive keyring package
        id: keyring
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ steps.signing.outputs.public_keys_base64 }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"

          if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
            echo "$APT_GPG_PUBLIC_KEYS_BASE64" | base64 -d > apt-public-keys.asc
          else
            gpg --batch --yes --armor --export "$APT_GPG_KEY_ID" > apt-public-keys.asc
          fi

          gpg --batch --yes --dearmor -o buildio-archive-keyring.gpg apt-public-keys.asc

          PACKAGE_ROOT="pkg/buildio-archive-keyring_${DEB_VERSION}_all"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/share/keyrings"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring"

          install -m 0644 buildio-archive-keyring.gpg "$PACKAGE_ROOT/usr/share/keyrings/buildio-archive-keyring.gpg"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/keyring-control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "buildio-archive-keyring_${DEB_VERSION}_all.deb"

          echo "keyring_deb_path=buildio-archive-keyring_${DEB_VERSION}_all.deb" >> "$GITHUB_OUTPUT"
          echo "public_keys_path=apt-public-keys.asc" >> "$GITHUB_OUTPUT"

      - name: Verify Debian packages
        env:
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
        run: |
          set -euo pipefail
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          dpkg-deb --info "$KEYRING_DEB_PATH"
          dpkg-deb --contents "$KEYRING_DEB_PATH"

      - name: Sign and verify Alpine package
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_KEYS_DIR: ${{ steps.apk_signing.outputs.keys_dir }}
        run: |
          set -euo pipefail
          APK_NAME="$(basename "$APK_PATH")"
          docker run --rm \
            -e APK_NAME \
            -v "$(dirname "$APK_PATH"):/work" \
            -v "${APK_KEYS_DIR}:/keys:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache abuild >/dev/null

              # Embed the repository signature in the package (RSA256 = RSA/SHA-256)
              abuild-sign -k /keys/buildio.rsa -t RSA256 "/work/$APK_NAME"

              # Verify like a user: trust the key, then install and run the binary
              cp /keys/buildio.rsa.pub /etc/apk/keys/
              apk add --no-cache "/work/$APK_NAME"
              BUILD_NO_UPDATE_CHECK=1 bld --help >/dev/null
              apk info bld
            '
          cp "$APK_PATH" "bld-${{ steps.apk.outputs.pkgver }}.apk"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish APT and Chocolatey repository
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_KEYS_DIR: ${{ steps.apk_signing.outputs.keys_dir }}
          PKGVER: ${{ steps.apk.outputs.pkgver }}
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
          PUBLIC_KEYS_PATH: ${{ steps.keyring.outputs.public_keys_path }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf public-pages existing-debs
          mkdir -p existing-debs

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add public-pages origin/gh-pages
          else
            git worktree add --detach public-pages
            git -C public-pages checkout --orphan gh-pages
            git -C public-pages rm -rf . || true
          fi

          shopt -s nullglob globstar
          old_debs=(public-pages/apt/pool/**/*.deb)
          if ((${#old_debs[@]})); then
            cp "${old_debs[@]}" existing-debs/
          fi
          cp "$DEB_PATH" existing-debs/
          cp "$KEYRING_DEB_PATH" existing-debs/

          APTLY_ROOT="$RUNNER_TEMP/aptly"
          rm -rf "$APTLY_ROOT"
          APTLY_CONFIG="$RUNNER_TEMP/aptly.conf"
          cat > "$APTLY_CONFIG" <<EOF
          {
            "rootDir": "$APTLY_ROOT",
            "downloadConcurrency": 4,
            "downloadSpeedLimit": 0,
            "architectures": [],
            "dependencyFollowSuggests": false,
            "dependencyFollowRecommends": false,
            "dependencyFollowAllVariants": false,
            "dependencyFollowSource": false,
            "dependencyVerboseResolve": false,
            "gpgDisableSign": false,
            "gpgDisableVerify": false,
            "gpgProvider": "gpg",
            "downloadSourcePackages": false,
            "skipLegacyPool": true,
            "ppaDistributorID": "ubuntu",
            "ppaCodename": "",
            "FileSystemPublishEndpoints": {},
            "S3PublishEndpoints": {},
            "SwiftPublishEndpoints": {}
          }
          EOF
          PUBLISH_ARGS=(
            -batch
            -distribution=stable
            -component=main
            -architectures=amd64,all
            -gpg-key="$APT_GPG_KEY_ID"
            -origin="Build.io"
            -label="Build.io CLI"
          )

          aptly -config="$APTLY_CONFIG" repo create -distribution=stable -component=main bld
          aptly -config="$APTLY_CONFIG" repo add -force-replace bld existing-debs
          aptly -config="$APTLY_CONFIG" publish repo "${PUBLISH_ARGS[@]}" bld apt

          cp "$PUBLIC_KEYS_PATH" "$APTLY_ROOT/public/apt/gpg.key"

          # --- APK repository: retain all published packages, re-index, sign ---
          rm -rf "$RUNNER_TEMP/apk-repo"
          mkdir -p "$RUNNER_TEMP/apk-repo/x86_64"
          if [ -d public-pages/apk/x86_64 ]; then
            cp public-pages/apk/x86_64/*.apk "$RUNNER_TEMP/apk-repo/x86_64/" 2>/dev/null || true
          fi
          cp "$APK_PATH" "$RUNNER_TEMP/apk-repo/x86_64/"

          docker run --rm \
            -v "$RUNNER_TEMP/apk-repo:/repo" \
            -v "$APK_KEYS_DIR:/keys:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache abuild >/dev/null
              apk index \
                --no-warnings --quiet \
                --output /repo/x86_64/APKINDEX.tar.gz \
                --description "Build.io CLI" \
                --rewrite-arch x86_64 \
                /repo/x86_64/*.apk
              abuild-sign -k /keys/buildio.rsa -t RSA256 /repo/x86_64/APKINDEX.tar.gz
            '

          rm -rf public-pages/apk
          mkdir -p public-pages/apk
          cp -a "$RUNNER_TEMP/apk-repo/x86_64" public-pages/apk/x86_64
          cp "$APK_KEYS_DIR/buildio.rsa.pub" public-pages/apk/buildio.rsa.pub

          rm -rf public-pages/apt
          cp -a "$APTLY_ROOT/public/apt" public-pages/apt
          python3 - <<'PY' > public-pages/install.sh
          from pathlib import Path
          import sys

          lines = Path("README.md").read_text().splitlines()
          marker = next((i for i, line in enumerate(lines) if line == "Same APT setup without `curl | sh`:"), None)
          if marker is None:
              sys.exit("README.md is missing the Same APT setup section")

          start = next((i for i in range(marker + 1, len(lines)) if lines[i] == "```bash"), None)
          if start is None:
              sys.exit("README.md Same APT setup section is missing a bash code block")

          end = next((i for i in range(start + 1, len(lines)) if lines[i] == "```"), None)
          if end is None:
              sys.exit("README.md Same APT setup section has an unterminated code block")

          install_script = "\n".join(lines[start + 1:end]).strip()
          if not install_script:
              sys.exit("README.md Same APT setup section is empty")

          print(install_script)
          PY
          chmod 0755 public-pages/install.sh
          touch public-pages/.nojekyll

          git -C public-pages add apt apk install.sh .nojekyll
          git -C public-pages commit -m "Publish APT package ${DEB_VERSION} and APK package ${PKGVER}" || true
          git -C public-pages push origin HEAD:gh-pages

      - name: Build release body
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-body.md
          from pathlib import Path
          import os
          import sys

          readme = Path("README.md").read_text()
          lines = readme.splitlines()

          start = next((i for i, line in enumerate(lines) if line == "## Install"), None)
          if start is None:
              sys.exit("README.md is missing a ## Install section")

          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          install = "\n".join(lines[start:end]).strip()
          if not install:
              sys.exit("README.md ## Install section is empty")

          print(f"Release of version {os.environ['VERSION']}")
          print()
          print(install)
          PY

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release-body.md
          files: |
            bin/linux-amd64/bld-linux-amd64.zip
            ${{ steps.deb.outputs.deb_path }}
            ${{ steps.keyring.outputs.keyring_deb_path }}
            bld-${{ steps.apk.outputs.pkgver }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-flatpak:
    name: Build Flatpak
    needs: build-linux-binary
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Linux binary release attachment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output packaging/flatpak/bld-linux-amd64.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/bld-linux-amd64.zip"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bld-linux-amd64.flatpak
          manifest-path: packaging/flatpak/io.build.Bld.yml
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Attach Flatpak to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bld-linux-amd64.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
