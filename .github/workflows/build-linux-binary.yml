name: Build Linux Binary
'on':
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g., 1.1.6)
        required: true
        type: string
concurrency:
  group: cli-pages-publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-linux-arm64-binary:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Linux binary
        run: |
          make build PLATFORM=linux/arm64
      - name: Create release zip
        run: |
          cd bin/linux-arm64
          zip -j bld-linux-arm64.zip bld
      - name: Prepare APK signing key
        id: apk_signing
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-keys"

          if [ -n "$APK_SIGNING_KEY_BASE64" ]; then
            echo "$APK_SIGNING_KEY_BASE64" | base64 -d | tar -C "$RUNNER_TEMP/apk-keys" -x
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APK_SIGNING_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Store the fine-grained PAT with secrets:write for the buildio/cli repository as the persistent bootstrap secret (same one the APT key bootstrap uses)."
              exit 1
            fi

            openssl genrsa -out "$RUNNER_TEMP/apk-keys/buildio.rsa" 4096 2>/dev/null
            openssl rsa -in "$RUNNER_TEMP/apk-keys/buildio.rsa" -pubout -out "$RUNNER_TEMP/apk-keys/buildio.rsa.pub" 2>/dev/null

            tar -C "$RUNNER_TEMP/apk-keys" -c buildio.rsa buildio.rsa.pub | base64 | tr -d '\n' > "$RUNNER_TEMP/apk-secret-body"
            echo "::add-mask::$(cat "$RUNNER_TEMP/apk-secret-body")"
            gh secret set APK_SIGNING_KEY_BASE64 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/apk-secret-body"
            rm -f "$RUNNER_TEMP/apk-secret-body"
            echo "Generated and saved a new APK signing key for future releases."
          fi

          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa"
          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa.pub"
          echo "keys_dir=$RUNNER_TEMP/apk-keys" >> "$GITHUB_OUTPUT"
      - name: Prepare pacman signing key
        id: pacman_signing
        env:
          PACMAN_GPG_PRIVATE_KEY_BASE64: ${{ secrets.PACMAN_GPG_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pacman-gnupg"
          chmod 700 "$RUNNER_TEMP/pacman-gnupg"

          if [ -n "$PACMAN_GPG_PRIVATE_KEY_BASE64" ]; then
            echo "$PACMAN_GPG_PRIVATE_KEY_BASE64" | base64 -d | GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --import
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::PACMAN_GPG_PRIVATE_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Store the fine-grained PAT with secrets:write for the buildio/cli repository as the persistent bootstrap secret (same one the APT key bootstrap uses)."
              exit 1
            fi

            cat > "$RUNNER_TEMP/pacman-gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Build.io Pacman Repository
          Name-Email: support@build.io
          Expire-Date: 0
          %commit
          EOF

            GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --generate-key "$RUNNER_TEMP/pacman-gpg-batch"
            PRIVATE_KEY_BASE64="$(GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --yes --armor --export-secret-keys | base64 | tr -d '\n')"
            echo "::add-mask::$PRIVATE_KEY_BASE64"
            printf '%s' "$PRIVATE_KEY_BASE64" | gh secret set PACMAN_GPG_PRIVATE_KEY_BASE64 --repo "$GITHUB_REPOSITORY"
            echo "Generated and saved a new pacman signing key for future releases."
          fi

          KEY_FPR="$(GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "$KEY_FPR"
          GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --yes --armor --export "$KEY_FPR" > "$RUNNER_TEMP/pacman-public-key.asc"
          {
            echo "key_fpr=$KEY_FPR"
            echo "gnupg_home=$RUNNER_TEMP/pacman-gnupg"
            echo "public_key_path=$RUNNER_TEMP/pacman-public-key.asc"
          } >> "$GITHUB_OUTPUT"
      - name: Build Alpine package
        id: apk
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          PKGVER="${VERSION}-r0"
          export PKGVER
          BUILDDATE="$(git log -1 --pretty=format:%ct)"
          SIZE="$(stat -c '%s' bin/linux-arm64/bld)"

          mkdir -p "$RUNNER_TEMP/apk-build/pkg/usr/bin"
          install -m 0755 bin/linux-arm64/bld "$RUNNER_TEMP/apk-build/pkg/usr/bin/bld"

          sed \
            -e "s/@PKGVER@/${PKGVER}/" \
            -e "s/@BUILDDATE@/${BUILDDATE}/" \
            -e "s/@SIZE@/${SIZE}/" \
            -e "s/@ARCH@/aarch64/" \
            packaging/apk/PKGINFO.tpl > "$RUNNER_TEMP/apk-build/.PKGINFO"

          docker run --rm \
            -e PKGVER \
            -v "$RUNNER_TEMP/apk-build:/work" \
            -v "${{ steps.apk_signing.outputs.keys_dir }}:/keys:ro" \
            -w /work \
            alpine:3.24 \
            sh -c '
              # functions.sh is not set -u safe (unguarded ${VAR-$VAR} refs)
              set -e
              apk add --no-cache abuild >/dev/null
              . /usr/share/abuild/functions.sh

              # Data section: sorted, per-file checksums (mirrors abuild create_apks)
              (
                cd pkg
                find usr -print0 | LC_ALL=C sort -z \
                  | apk_tar -T - --owner=0 --group=0 --numeric-owner \
                  | abuild-tar --hash | gzip -n -9
              ) > data.tar.gz

              # Control section: .PKGINFO with datahash, signed like abuild create_apks
              # (signature covers the control section only when a datahash exists)
              echo "datahash = $(sha256sum data.tar.gz | cut -f1 -d" ")" >> .PKGINFO
              printf "%s\0" .PKGINFO > .metafiles
              apk_tar -T .metafiles | abuild-tar --cut | gzip -n -9 > control.tar.gz
              abuild-sign -k /keys/buildio.rsa -t RSA256 control.tar.gz

              cat control.tar.gz data.tar.gz > "bld-${PKGVER}.apk"
            '

          echo "apk_path=$RUNNER_TEMP/apk-build/bld-${PKGVER}.apk" >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"
          mkdir -p arm64-artifacts
          cp "$RUNNER_TEMP/apk-build/bld-${PKGVER}.apk" arm64-artifacts/
          cp bin/linux-arm64/bld-linux-arm64.zip arm64-artifacts/
      - name: Build pacman package
        id: pacman
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          GNUPG_HOME: ${{ steps.pacman_signing.outputs.gnupg_home }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          PKGVER="${VERSION}-1"
          export PKGVER
          BUILDDATE="$(git log -1 --pretty=format:%ct)"
          SIZE="$(stat -c '%s' bin/linux-arm64/bld)"

          mkdir -p "$RUNNER_TEMP/pacman-build/pkg/usr/bin"
          install -m 0755 bin/linux-arm64/bld "$RUNNER_TEMP/pacman-build/pkg/usr/bin/bld"

          sed \
            -e "s/@VER@/${PKGVER}/" \
            -e "s/@BUILDDATE@/${BUILDDATE}/" \
            -e "s/@SIZE@/${SIZE}/" \
            -e "s/@ARCH@/aarch64/" \
            packaging/pacman/PKGINFO.tpl > "$RUNNER_TEMP/pacman-build/pkg/.PKGINFO"

          # archlinux:base has no arm64 manifest; the package format only needs
          # bsdtar + zstd, which alpine provides multi-arch
          docker run --rm \
            -e PKGVER \
            -v "$RUNNER_TEMP/pacman-build:/work" \
            -w /work \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache libarchive-tools zstd >/dev/null

              # .MTREE (makepkg option set; entry layout matches real packages)
              (
                cd pkg
                find . -mindepth 1 | LC_ALL=C sort | sed "s|^\./||" | tr "\n" "\0" \
                  | bsdtar -cnf - --format=mtree \
                    --options="!all,use-set,type,uid,gid,mode,time,size,sha256,link" \
                    --null --files-from - --exclude .MTREE | gzip -c -f -n > .MTREE
              )

              # Package assembly (makepkg recipe)
              (
                cd pkg
                find . -mindepth 1 | LC_ALL=C sort | sed "s|^\./||" | tr "\n" "\0" \
                  | bsdtar --no-fflags -cnf - --null --files-from - \
                  | zstd -q
              ) > "bld-${PKGVER}-aarch64.pkg.tar.zst"
            '

          # Detached package signature (runner-side gpg)
          GNUPGHOME="$GNUPG_HOME" gpg --batch --yes --detach-sign --no-armor \
            "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst"

          test -s "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst"
          test -s "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst.sig"
          echo "pkg_path=$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst" arm64-artifacts/
          cp "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-aarch64.pkg.tar.zst.sig" arm64-artifacts/
      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-artifacts
          path: arm64-artifacts/
          if-no-files-found: error
  build-linux-binary:
    needs: build-linux-arm64-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly dpkg-dev gnupg
      - name: Build Linux binary
        run: |
          make build
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release zip
        run: |
          cd bin/linux-amd64
          zip -j bld-linux-amd64.zip bld
      - name: Build Debian package
        id: deb
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          DEB_VERSION="${VERSION}-1"
          PACKAGE_ROOT="pkg/bld_${DEB_VERSION}_amd64"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/bld"

          install -m 0755 bin/linux-amd64/bld "$PACKAGE_ROOT/usr/bin/bld"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/bld/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "bld_${DEB_VERSION}_amd64.deb"

          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_path=bld_${DEB_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
      - name: Prepare APK signing key
        id: apk_signing
        env:
          APK_SIGNING_KEY_BASE64: ${{ secrets.APK_SIGNING_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-keys"

          if [ -n "$APK_SIGNING_KEY_BASE64" ]; then
            echo "$APK_SIGNING_KEY_BASE64" | base64 -d | tar -C "$RUNNER_TEMP/apk-keys" -x
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APK_SIGNING_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Store the fine-grained PAT with secrets:write for the buildio/cli repository as the persistent bootstrap secret (same one the APT key bootstrap uses)."
              exit 1
            fi

            openssl genrsa -out "$RUNNER_TEMP/apk-keys/buildio.rsa" 4096 2>/dev/null
            openssl rsa -in "$RUNNER_TEMP/apk-keys/buildio.rsa" -pubout -out "$RUNNER_TEMP/apk-keys/buildio.rsa.pub" 2>/dev/null

            tar -C "$RUNNER_TEMP/apk-keys" -c buildio.rsa buildio.rsa.pub | base64 | tr -d '\n' > "$RUNNER_TEMP/apk-secret-body"
            echo "::add-mask::$(cat "$RUNNER_TEMP/apk-secret-body")"
            gh secret set APK_SIGNING_KEY_BASE64 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/apk-secret-body"
            rm -f "$RUNNER_TEMP/apk-secret-body"
            echo "Generated and saved a new APK signing key for future releases."
          fi

          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa"
          test -s "$RUNNER_TEMP/apk-keys/buildio.rsa.pub"
          echo "keys_dir=$RUNNER_TEMP/apk-keys" >> "$GITHUB_OUTPUT"
      - name: Prepare pacman signing key
        id: pacman_signing
        env:
          PACMAN_GPG_PRIVATE_KEY_BASE64: ${{ secrets.PACMAN_GPG_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pacman-gnupg"
          chmod 700 "$RUNNER_TEMP/pacman-gnupg"

          if [ -n "$PACMAN_GPG_PRIVATE_KEY_BASE64" ]; then
            echo "$PACMAN_GPG_PRIVATE_KEY_BASE64" | base64 -d | GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --import
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::PACMAN_GPG_PRIVATE_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Store the fine-grained PAT with secrets:write for the buildio/cli repository as the persistent bootstrap secret (same one the APT key bootstrap uses)."
              exit 1
            fi

            cat > "$RUNNER_TEMP/pacman-gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Build.io Pacman Repository
          Name-Email: support@build.io
          Expire-Date: 0
          %commit
          EOF

            GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --generate-key "$RUNNER_TEMP/pacman-gpg-batch"
            PRIVATE_KEY_BASE64="$(GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --yes --armor --export-secret-keys | base64 | tr -d '\n')"
            echo "::add-mask::$PRIVATE_KEY_BASE64"
            printf '%s' "$PRIVATE_KEY_BASE64" | gh secret set PACMAN_GPG_PRIVATE_KEY_BASE64 --repo "$GITHUB_REPOSITORY"
            echo "Generated and saved a new pacman signing key for future releases."
          fi

          KEY_FPR="$(GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "$KEY_FPR"
          GNUPGHOME="$RUNNER_TEMP/pacman-gnupg" gpg --batch --yes --armor --export "$KEY_FPR" > "$RUNNER_TEMP/pacman-public-key.asc"
          {
            echo "key_fpr=$KEY_FPR"
            echo "gnupg_home=$RUNNER_TEMP/pacman-gnupg"
            echo "public_key_path=$RUNNER_TEMP/pacman-public-key.asc"
          } >> "$GITHUB_OUTPUT"
      - name: Build Alpine package
        id: apk
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          PKGVER="${VERSION}-r0"
          export PKGVER
          BUILDDATE="$(git log -1 --pretty=format:%ct)"
          SIZE="$(stat -c '%s' bin/linux-amd64/bld)"

          mkdir -p "$RUNNER_TEMP/apk-build/pkg/usr/bin"
          install -m 0755 bin/linux-amd64/bld "$RUNNER_TEMP/apk-build/pkg/usr/bin/bld"

          sed \
            -e "s/@PKGVER@/${PKGVER}/" \
            -e "s/@BUILDDATE@/${BUILDDATE}/" \
            -e "s/@SIZE@/${SIZE}/" \
            -e "s/@ARCH@/x86_64/" \
            packaging/apk/PKGINFO.tpl > "$RUNNER_TEMP/apk-build/.PKGINFO"

          docker run --rm \
            -e PKGVER \
            -v "$RUNNER_TEMP/apk-build:/work" \
            -v "${{ steps.apk_signing.outputs.keys_dir }}:/keys:ro" \
            -w /work \
            alpine:3.24 \
            sh -c '
              # functions.sh is not set -u safe (unguarded ${VAR-$VAR} refs)
              set -e
              apk add --no-cache abuild >/dev/null
              . /usr/share/abuild/functions.sh

              # Data section: sorted, per-file checksums (mirrors abuild create_apks)
              (
                cd pkg
                find usr -print0 | LC_ALL=C sort -z \
                  | apk_tar -T - --owner=0 --group=0 --numeric-owner \
                  | abuild-tar --hash | gzip -n -9
              ) > data.tar.gz

              # Control section: .PKGINFO with datahash, signed like abuild create_apks
              # (signature covers the control section only when a datahash exists)
              echo "datahash = $(sha256sum data.tar.gz | cut -f1 -d" ")" >> .PKGINFO
              printf "%s\0" .PKGINFO > .metafiles
              apk_tar -T .metafiles | abuild-tar --cut | gzip -n -9 > control.tar.gz
              abuild-sign -k /keys/buildio.rsa -t RSA256 control.tar.gz

              cat control.tar.gz data.tar.gz > "bld-${PKGVER}.apk"
            '

          echo "apk_path=$RUNNER_TEMP/apk-build/bld-${PKGVER}.apk" >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"
      - name: Build pacman package
        id: pacman
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          GNUPG_HOME: ${{ steps.pacman_signing.outputs.gnupg_home }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          PKGVER="${VERSION}-1"
          export PKGVER
          BUILDDATE="$(git log -1 --pretty=format:%ct)"
          SIZE="$(stat -c '%s' bin/linux-amd64/bld)"

          mkdir -p "$RUNNER_TEMP/pacman-build/pkg/usr/bin"
          install -m 0755 bin/linux-amd64/bld "$RUNNER_TEMP/pacman-build/pkg/usr/bin/bld"

          sed \
            -e "s/@VER@/${PKGVER}/" \
            -e "s/@BUILDDATE@/${BUILDDATE}/" \
            -e "s/@SIZE@/${SIZE}/" \
            -e "s/@ARCH@/x86_64/" \
            packaging/pacman/PKGINFO.tpl > "$RUNNER_TEMP/pacman-build/pkg/.PKGINFO"

          # archlinux:base has no arm64 manifest; the package format only needs
          # bsdtar + zstd, which alpine provides multi-arch
          docker run --rm \
            -e PKGVER \
            -v "$RUNNER_TEMP/pacman-build:/work" \
            -w /work \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache libarchive-tools zstd >/dev/null

              # .MTREE (makepkg option set; entry layout matches real packages)
              (
                cd pkg
                find . -mindepth 1 | LC_ALL=C sort | sed "s|^\./||" | tr "\n" "\0" \
                  | bsdtar -cnf - --format=mtree \
                    --options="!all,use-set,type,uid,gid,mode,time,size,sha256,link" \
                    --null --files-from - --exclude .MTREE | gzip -c -f -n > .MTREE
              )

              # Package assembly (makepkg recipe)
              (
                cd pkg
                find . -mindepth 1 | LC_ALL=C sort | sed "s|^\./||" | tr "\n" "\0" \
                  | bsdtar --no-fflags -cnf - --null --files-from - \
                  | zstd -q
              ) > "bld-${PKGVER}-x86_64.pkg.tar.zst"
            '

          # Detached package signature (runner-side gpg)
          GNUPGHOME="$GNUPG_HOME" gpg --batch --yes --detach-sign --no-armor \
            "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-x86_64.pkg.tar.zst"

          test -s "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-x86_64.pkg.tar.zst"
          test -s "$RUNNER_TEMP/pacman-build/bld-${PKGVER}-x86_64.pkg.tar.zst.sig"
          echo "pkg_path=$RUNNER_TEMP/pacman-build/bld-${PKGVER}-x86_64.pkg.tar.zst" >> "$GITHUB_OUTPUT"
      - name: Prepare APT signing key
        id: signing
        env:
          APT_GPG_PRIVATE_KEY_BASE64: ${{ secrets.APT_GPG_PRIVATE_KEY_BASE64 }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ vars.APT_GPG_PUBLIC_KEYS_BASE64 }}
          GH_TOKEN: ${{ secrets.APT_SECRET_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          if [ -n "$APT_GPG_PRIVATE_KEY_BASE64" ]; then
            echo "$APT_GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          else
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::APT_GPG_PRIVATE_KEY_BASE64 is missing and APT_SECRET_BOOTSTRAP_TOKEN is unavailable. Run locally to open GitHub's prefilled fine-grained PAT form, select only the buildio/cli repository, paste the generated token, and store it as the persistent bootstrap secret for key bootstrap/rotation: open 'https://github.com/settings/personal-access-tokens/new?name=Build.io+APT+bootstrap&description=Persistent+token+used+by+the+Build+CLI+release+workflow+to+store+and+rotate+APT+signing+secrets&target_name=buildio&expires_in=none&secrets=write' && read -rsp 'Paste fine-grained PAT: ' APT_SECRET_BOOTSTRAP_TOKEN && echo && gh secret set APT_SECRET_BOOTSTRAP_TOKEN --repo $GITHUB_REPOSITORY --body \"\$APT_SECRET_BOOTSTRAP_TOKEN\""
              exit 1
            fi

            cat > "$RUNNER_TEMP/apt-gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Build.io APT Repository
          Name-Email: support@build.io
          Expire-Date: 0
          %commit
          EOF

            gpg --batch --generate-key "$RUNNER_TEMP/apt-gpg-batch"
            KEY_ID="$(gpg --batch --with-colons --fingerprint --list-secret-keys "Build.io APT Repository <support@build.io>" | awk -F: '$1 == "fpr" {print $10; exit}')"

            PRIVATE_KEY_BASE64="$(gpg --batch --yes --armor --export-secret-keys "$KEY_ID" | base64 | tr -d '\n')"
            PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            echo "::add-mask::$PRIVATE_KEY_BASE64"

            printf '%s' "$PRIVATE_KEY_BASE64" | gh secret set APT_GPG_PRIVATE_KEY_BASE64 --repo "$GITHUB_REPOSITORY"
            echo "Generated and saved a new APT signing key for future releases."
          fi

          if [ -z "$KEY_ID" ]; then
            echo "::error::Unable to determine the APT signing key fingerprint."
            exit 1
          fi

          gpg --batch --list-secret-keys "$KEY_ID" >/dev/null

          if [ -z "${PUBLIC_KEYS_BASE64:-}" ]; then
            if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
              PUBLIC_KEYS_BASE64="$APT_GPG_PUBLIC_KEYS_BASE64"
            else
              PUBLIC_KEYS_BASE64="$(gpg --batch --yes --armor --export "$KEY_ID" | base64 | tr -d '\n')"
            fi
          fi

          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          {
            echo "public_keys_base64<<EOF"
            printf '%s\n' "$PUBLIC_KEYS_BASE64"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build archive keyring package
        id: keyring
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          APT_GPG_PUBLIC_KEYS_BASE64: ${{ steps.signing.outputs.public_keys_base64 }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"

          if [ -n "$APT_GPG_PUBLIC_KEYS_BASE64" ]; then
            echo "$APT_GPG_PUBLIC_KEYS_BASE64" | base64 -d > apt-public-keys.asc
          else
            gpg --batch --yes --armor --export "$APT_GPG_KEY_ID" > apt-public-keys.asc
          fi

          gpg --batch --yes --dearmor -o buildio-archive-keyring.gpg apt-public-keys.asc

          PACKAGE_ROOT="pkg/buildio-archive-keyring_${DEB_VERSION}_all"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/share/keyrings"
          mkdir -p "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring"

          install -m 0644 buildio-archive-keyring.gpg "$PACKAGE_ROOT/usr/share/keyrings/buildio-archive-keyring.gpg"
          sed "s/@DEB_VERSION@/${DEB_VERSION}/g" packaging/deb/keyring-control.tpl > "$PACKAGE_ROOT/DEBIAN/control"
          install -m 0644 packaging/deb/copyright "$PACKAGE_ROOT/usr/share/doc/buildio-archive-keyring/copyright"

          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "buildio-archive-keyring_${DEB_VERSION}_all.deb"

          echo "keyring_deb_path=buildio-archive-keyring_${DEB_VERSION}_all.deb" >> "$GITHUB_OUTPUT"
          echo "public_keys_path=apt-public-keys.asc" >> "$GITHUB_OUTPUT"
      - name: Verify Debian packages
        env:
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
        run: |
          set -euo pipefail
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          dpkg-deb --info "$KEYRING_DEB_PATH"
          dpkg-deb --contents "$KEYRING_DEB_PATH"
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-artifacts
          path: arm64-artifacts
      - name: Verify Alpine packages
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_KEYS_DIR: ${{ steps.apk_signing.outputs.keys_dir }}
          PKGVER: ${{ steps.apk.outputs.pkgver }}
        run: |
          set -euo pipefail
          APK_NAME="$(basename "$APK_PATH")"
          export APK_NAME
          ARM_APK="arm64-artifacts/bld-${PKGVER}.apk"
          test -s "$ARM_APK"

          # Packages arrive signed from the build steps (control section signed
          # before assembly, as abuild's create_apks does); verify like a user.
          docker run --rm \
            -e APK_NAME \
            -v "$(dirname "$APK_PATH"):/work" \
            -v "${APK_KEYS_DIR}:/keys:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              cp /keys/buildio.rsa.pub /etc/apk/keys/
              apk add --no-cache "/work/$APK_NAME"
              BUILD_NO_UPDATE_CHECK=1 bld --help >/dev/null
              apk info bld
            '

          # Verify the aarch64 package under emulation
          mv "$ARM_APK" "arm64-artifacts/bld-aarch64.apk"
          docker run --rm \
            --platform linux/arm64 \
            -v "$(pwd)/arm64-artifacts:/work" \
            -v "${APK_KEYS_DIR}:/keys:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              cp /keys/buildio.rsa.pub /etc/apk/keys/
              apk add --no-cache /work/bld-aarch64.apk
              BUILD_NO_UPDATE_CHECK=1 bld --help >/dev/null
              apk info bld
            '
          mv arm64-artifacts/bld-aarch64.apk "bld-${PKGVER}_aarch64.apk"
          cp "$APK_PATH" "bld-${PKGVER}.apk"
      - name: Verify pacman packages
        env:
          GNUPG_HOME: ${{ steps.pacman_signing.outputs.gnupg_home }}
          PUBLIC_KEY_PATH: ${{ steps.pacman_signing.outputs.public_key_path }}
          KEY_FPR: ${{ steps.pacman_signing.outputs.key_fpr }}
          PKG_PATH: ${{ steps.pacman.outputs.pkg_path }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          PVER="${VERSION}-1"
          export PVER
          ARM_PKG="arm64-artifacts/bld-${PVER}-aarch64.pkg.tar.zst"
          test -s "$ARM_PKG"
          test -s "$ARM_PKG.sig"

          # Stage key + both arch packages in per-arch repo dirs
          mkdir -p pacman-verify/x86_64 pacman-verify/aarch64
          cp "$PUBLIC_KEY_PATH" pacman-verify/k
          cp "$PKG_PATH" "$PKG_PATH.sig" pacman-verify/x86_64/
          cp "$ARM_PKG" "$ARM_PKG.sig" pacman-verify/aarch64/

          # Build signed repo databases (repo-add --sign with the repository key)
          docker run --rm \
            -e GNUPGHOME=/gnupg \
            -e KEY_FPR \
            -v "$(pwd)/pacman-verify:/repo" \
            -v "${GNUPG_HOME}:/gnupg" \
            archlinux:base \
            bash -c '
              set -eu
              cd /repo/x86_64
              repo-add -s -k "$KEY_FPR" bld.db.tar.gz bld-*.pkg.tar.zst
              cd ../aarch64
              repo-add -s -k "$KEY_FPR" bld.db.tar.gz bld-*.pkg.tar.zst
            '

          # Verify like a user on x86_64: trust key, install from repo, run the binary.
          # (archlinux:base has no arm64 manifest, so aarch64 is verified separately below)
          docker run --rm \
            -e KEY_FPR \
            -v "$(pwd)/pacman-verify:/repo:ro" \
            archlinux:base \
            bash -c '
              set -eu
              pacman-key --init
              pacman-key --add /repo/k
              pacman-key --lsign-key "$KEY_FPR"
              printf "[bld]\nServer = file:///repo/x86_64\n" >> /etc/pacman.conf
              pacman -Sy --noconfirm bld
              BUILD_NO_UPDATE_CHECK=1 bld --help >/dev/null
              pacman -Qi bld | head -5
            '

          docker run --rm \
            --platform linux/arm64 \
            -e KEY_FPR -e PVER \
            -v "$(pwd)/pacman-verify:/repo:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              apk add --no-cache gnupg libarchive-tools >/dev/null
              cd /repo/aarch64
              gpg --verify bld-*.pkg.tar.zst.sig bld-*.pkg.tar.zst
              bsdtar -tf bld-*.pkg.tar.zst | grep -qx ".PKGINFO"
              bsdtar -xOqf bld-*.pkg.tar.zst .PKGINFO | grep -qx "arch = aarch64"
              bsdtar -tf bld.db.tar.gz | grep -q "bld-${PVER}/"
            '
          echo "aarch64 package verified (signature, structure, metadata, db entry)"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish APT and Chocolatey repository
        env:
          APT_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_KEYS_DIR: ${{ steps.apk_signing.outputs.keys_dir }}
          PKGVER: ${{ steps.apk.outputs.pkgver }}
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
          DEB_VERSION: ${{ steps.deb.outputs.deb_version }}
          KEYRING_DEB_PATH: ${{ steps.keyring.outputs.keyring_deb_path }}
          PUBLIC_KEYS_PATH: ${{ steps.keyring.outputs.public_keys_path }}
          PACMAN_GNUPG_HOME: ${{ steps.pacman_signing.outputs.gnupg_home }}
          PACMAN_PKG_PATH: ${{ steps.pacman.outputs.pkg_path }}
          PACMAN_KEY_FPR: ${{ steps.pacman_signing.outputs.key_fpr }}
        run: |
          set -euo pipefail
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID is required}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf public-pages existing-debs
          mkdir -p existing-debs

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add public-pages origin/gh-pages
          else
            git worktree add --detach public-pages
            git -C public-pages checkout --orphan gh-pages
            git -C public-pages rm -rf . || true
          fi

          shopt -s nullglob globstar
          old_debs=(public-pages/apt/pool/**/*.deb)
          if ((${#old_debs[@]})); then
            cp "${old_debs[@]}" existing-debs/
          fi
          cp "$DEB_PATH" existing-debs/
          cp "$KEYRING_DEB_PATH" existing-debs/

          APTLY_ROOT="$RUNNER_TEMP/aptly"
          rm -rf "$APTLY_ROOT"
          APTLY_CONFIG="$RUNNER_TEMP/aptly.conf"
          cat > "$APTLY_CONFIG" <<EOF
          {
            "rootDir": "$APTLY_ROOT",
            "downloadConcurrency": 4,
            "downloadSpeedLimit": 0,
            "architectures": [],
            "dependencyFollowSuggests": false,
            "dependencyFollowRecommends": false,
            "dependencyFollowAllVariants": false,
            "dependencyFollowSource": false,
            "dependencyVerboseResolve": false,
            "gpgDisableSign": false,
            "gpgDisableVerify": false,
            "gpgProvider": "gpg",
            "downloadSourcePackages": false,
            "skipLegacyPool": true,
            "ppaDistributorID": "ubuntu",
            "ppaCodename": "",
            "FileSystemPublishEndpoints": {},
            "S3PublishEndpoints": {},
            "SwiftPublishEndpoints": {}
          }
          EOF
          PUBLISH_ARGS=(
            -batch
            -distribution=stable
            -component=main
            -architectures=amd64,all
            -gpg-key="$APT_GPG_KEY_ID"
            -origin="Build.io"
            -label="Build.io CLI"
          )

          aptly -config="$APTLY_CONFIG" repo create -distribution=stable -component=main bld
          aptly -config="$APTLY_CONFIG" repo add -force-replace bld existing-debs
          aptly -config="$APTLY_CONFIG" publish repo "${PUBLISH_ARGS[@]}" bld apt

          cp "$PUBLIC_KEYS_PATH" "$APTLY_ROOT/public/apt/gpg.key"

          # --- APK repositories: retain all published packages, re-index, sign ---
          rm -rf "$RUNNER_TEMP/apk-repo"
          for ARCH in x86_64 aarch64; do
            mkdir -p "$RUNNER_TEMP/apk-repo/$ARCH"
            # Retain only conventional name-version.apk files; apk fetches
            # ${arch}/${name}-${version}.apk, anything else is unreachable.
            if [ -d "public-pages/apk/$ARCH" ]; then
              cp "public-pages/apk/$ARCH"/bld-*.apk "$RUNNER_TEMP/apk-repo/$ARCH/" 2>/dev/null || true
              rm -f "$RUNNER_TEMP/apk-repo/$ARCH"/*_aarch64.apk
            fi
          done
          cp "$APK_PATH" "$RUNNER_TEMP/apk-repo/x86_64/"
          # apk fetches ${arch}/${name}-${version}.apk; the _aarch64 suffix is
          # release-asset naming only, so use the conventional name in the repo
          cp "bld-${PKGVER}_aarch64.apk" "$RUNNER_TEMP/apk-repo/aarch64/bld-${PKGVER}.apk"

          docker run --rm \
            -v "$RUNNER_TEMP/apk-repo:/repo" \
            -v "$APK_KEYS_DIR:/keys:ro" \
            alpine:3.24 \
            sh -c '
              set -eu
              # apk-tools 3 verifies each input package against /etc/apk/keys/
              cp /keys/buildio.rsa.pub /etc/apk/keys/
              apk add --no-cache abuild >/dev/null
              for ARCH in x86_64 aarch64; do
                apk index \
                  --no-warnings --quiet \
                  --output "/repo/$ARCH/APKINDEX.tar.gz" \
                  --description "Build.io CLI" \
                  --rewrite-arch "$ARCH" \
                  /repo/$ARCH/*.apk
                abuild-sign -k /keys/buildio.rsa -t RSA256 "/repo/$ARCH/APKINDEX.tar.gz"
              done
            '

          rm -rf public-pages/apk
          mkdir -p public-pages/apk
          cp -a "$RUNNER_TEMP/apk-repo/x86_64" public-pages/apk/x86_64
          cp -a "$RUNNER_TEMP/apk-repo/aarch64" public-pages/apk/aarch64
          cp "$APK_KEYS_DIR/buildio.rsa.pub" public-pages/apk/buildio.rsa.pub

          # --- pacman repositories: retain all published packages, rebuild, sign ---
          rm -rf "$RUNNER_TEMP/pacman-repo"
          for ARCH in x86_64 aarch64; do
            mkdir -p "$RUNNER_TEMP/pacman-repo/$ARCH"
            if [ -d "public-pages/pacman/$ARCH" ]; then
              cp "public-pages/pacman/$ARCH"/bld-*.pkg.tar.zst "$RUNNER_TEMP/pacman-repo/$ARCH/" 2>/dev/null || true
              cp "public-pages/pacman/$ARCH"/bld-*.pkg.tar.zst.sig "$RUNNER_TEMP/pacman-repo/$ARCH/" 2>/dev/null || true
            fi
          done
          cp "$PACMAN_PKG_PATH" "$PACMAN_PKG_PATH.sig" "$RUNNER_TEMP/pacman-repo/x86_64/"
          PVER="${PKGVER%-r0}-1"
          cp "arm64-artifacts/bld-${PVER}-aarch64.pkg.tar.zst" "$RUNNER_TEMP/pacman-repo/aarch64/"
          cp "arm64-artifacts/bld-${PVER}-aarch64.pkg.tar.zst.sig" "$RUNNER_TEMP/pacman-repo/aarch64/"

          docker run --rm \
            -e GNUPGHOME=/gnupg \
            -e KEY_FPR \
            -v "$RUNNER_TEMP/pacman-repo:/repo" \
            -v "$PACMAN_GNUPG_HOME:/gnupg" \
            archlinux:base \
            bash -c '
              set -eu
              for ARCH in x86_64 aarch64; do
                cd "/repo/$ARCH"
                repo-add -s -k "$KEY_FPR" bld.db.tar.gz bld-*.pkg.tar.zst
              done
            '

          rm -rf public-pages/pacman
          mkdir -p public-pages/pacman
          cp -a "$RUNNER_TEMP/pacman-repo/x86_64" public-pages/pacman/x86_64
          cp -a "$RUNNER_TEMP/pacman-repo/aarch64" public-pages/pacman/aarch64
          cp "$PUBLIC_KEYS_PATH" public-pages/pacman/k
          printf '%s\n' "$PACMAN_KEY_FPR" > public-pages/pacman/f

          rm -rf public-pages/apt
          cp -a "$APTLY_ROOT/public/apt" public-pages/apt
          python3 - <<'PY' > public-pages/install.sh
          from pathlib import Path
          import sys

          lines = Path("README.md").read_text().splitlines()
          marker = next((i for i, line in enumerate(lines) if line == "Same APT setup without `curl | sh`:"), None)
          if marker is None:
              sys.exit("README.md is missing the Same APT setup section")

          start = next((i for i in range(marker + 1, len(lines)) if lines[i] == "```bash"), None)
          if start is None:
              sys.exit("README.md Same APT setup section is missing a bash code block")

          end = next((i for i in range(start + 1, len(lines)) if lines[i] == "```"), None)
          if end is None:
              sys.exit("README.md Same APT setup section has an unterminated code block")

          install_script = "\n".join(lines[start + 1:end]).strip()
          if not install_script:
              sys.exit("README.md Same APT setup section is empty")

          print(install_script)
          PY
          chmod 0755 public-pages/install.sh
          touch public-pages/.nojekyll

          git -C public-pages add apt apk pacman install.sh .nojekyll
          git -C public-pages commit -m "Publish APT package ${DEB_VERSION} and APK package ${PKGVER}" || true
          git -C public-pages push origin HEAD:gh-pages
      - name: Build release body
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-body.md
          from pathlib import Path
          import os
          import sys

          readme = Path("README.md").read_text()
          lines = readme.splitlines()

          start = next((i for i, line in enumerate(lines) if line == "## Install"), None)
          if start is None:
              sys.exit("README.md is missing a ## Install section")

          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          install = "\n".join(lines[start:end]).strip()
          if not install:
              sys.exit("README.md ## Install section is empty")

          print(f"Release of version {os.environ['VERSION']}")
          print()
          print(install)
          PY
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release-body.md
          files: |
            bin/linux-amd64/bld-linux-amd64.zip
            arm64-artifacts/bld-linux-arm64.zip
            ${{ steps.deb.outputs.deb_path }}
            ${{ steps.keyring.outputs.keyring_deb_path }}
            bld-${{ steps.apk.outputs.pkgver }}.apk
            bld-${{ steps.apk.outputs.pkgver }}_aarch64.apk
            pacman-verify/x86_64/bld-${{ steps.get_version.outputs.VERSION }}-1-x86_64.pkg.tar.zst
            pacman-verify/aarch64/bld-${{ steps.get_version.outputs.VERSION }}-1-aarch64.pkg.tar.zst
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-flatpak:
    name: Build Flatpak
    needs: build-linux-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Download Linux binary release attachment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output packaging/flatpak/bld-linux-amd64.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/bld-linux-amd64.zip"
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bld-linux-amd64.flatpak
          manifest-path: packaging/flatpak/io.build.Bld.yml
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Attach Flatpak to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bld-linux-amd64.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
